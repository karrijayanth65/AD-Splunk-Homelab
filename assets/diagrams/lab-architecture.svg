<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">AD and Splunk isolated lab architecture</title>
  <desc id="desc">Four proposed virtual machines on the internal AD-LAB network. Windows Security and Sysmon events flow from ADDC01 and TARGET-PC to Splunk on TCP 9997. Kali makes an authorized SMB test to TARGET-PC. This is a design illustration, not execution evidence.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker><marker id="testarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a45b16"/></marker></defs>
  <rect width="1200" height="690" fill="#f4f6fa"/>
  <rect width="1200" height="124" fill="#14263d"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="48" y="44" fill="#8dd6db" font-size="14" font-weight="700" letter-spacing="2">AD + SPLUNK HOMELAB</text>
    <text x="48" y="83" fill="#fff" font-size="30" font-weight="700">From domain authentication to searchable telemetry</text>
    <rect x="36" y="152" width="1128" height="428" rx="18" fill="#fff" stroke="#c5d0dd" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="60" y="183" fill="#334b65" font-size="15" font-weight="700">AD-LAB · VirtualBox internal network · 192.168.10.0/24</text>
    <text x="60" y="207" fill="#61738a" font-size="14">No Internet gateway on the exercise segment. Domain DNS: 192.168.10.7.</text>
    <g fill="#f6f8fc" stroke="#c7d3e2" stroke-width="1.5">
      <rect x="68" y="244" width="300" height="130" rx="12"/>
      <rect x="68" y="414" width="300" height="130" rx="12"/>
      <rect x="794" y="244" width="300" height="130" rx="12"/>
      <rect x="794" y="414" width="300" height="130" rx="12"/>
    </g>
    <g fill="#172f4b" font-size="22" font-weight="700">
      <text x="90" y="278">ADDC01</text><text x="90" y="448">TARGET-PC</text>
      <text x="816" y="278">SPLUNK</text><text x="816" y="448">KALI</text>
    </g>
    <g fill="#4d637d" font-size="16">
      <text x="90" y="308">192.168.10.7 · Windows Server</text>
      <text x="90" y="336">AD DS / DNS + event forwarder</text>
      <text x="90" y="478">192.168.10.100 · Windows member</text>
      <text x="90" y="506">SMB test target + event forwarder</text>
      <text x="816" y="308">192.168.10.10 · Ubuntu Server</text>
      <text x="816" y="336">Receiver 9997 / Web 8000</text>
      <text x="816" y="478">192.168.10.250 · test client</text>
      <text x="816" y="506">Dedicated account / bounded test</text>
    </g>
    <path d="M368 295H774" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M368 445H537V341H774" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="455" y="251" width="240" height="28" rx="5" fill="#e4f4f4"/>
    <text x="575" y="271" text-anchor="middle" fill="#08616b" font-size="14" font-weight="600">Windows events → TCP 9997</text>
    <rect x="564" y="354" width="187" height="53" rx="8" fill="#e4f4f4"/>
    <text x="580" y="376" fill="#08616b" font-size="14">Security + Sysmon</text>
    <text x="580" y="395" fill="#08616b" font-size="14">index = endpoint</text>
    <path d="M794 508H388" stroke="#a45b16" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#testarrow)"/>
    <rect x="430" y="518" width="320" height="25" rx="4" fill="#fff5e7"/>
    <text x="590" y="536" text-anchor="middle" fill="#8a4c12" font-size="14">Authorized SMB authentication · TCP 445</text>
    <text x="48" y="620" fill="#172f4b" font-size="18" font-weight="600">Design principle</text>
    <text x="48" y="648" fill="#4d637d" font-size="16">Verify the event path before interpreting a detection. Keep test activity inside the lab.</text>
    <text x="1150" y="672" text-anchor="end" fill="#65778e" font-size="12">Original design illustration · not a live capture</text>
  </g>
</svg>
